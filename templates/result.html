<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Result</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            background-color: #f4f7f6;
        }

        .toolbar {
            background: #333;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .toolbar a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background-color: #007bff;
            border-radius: 4px;
        }

        .toolbar a:hover {
            background-color: #0056b3;
        }

        .content-frame {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <h1>Conversion Result</h1>
        <div>
            {% if doc_path %}
            <a href="{{ url_for('download', filename=doc_path) }}">Download as DOCX</a>
            {% endif %}
            <a href="{{ url_for('index') }}">Process Another File</a>
        </div>
    </div>
    <iframe class="content-frame" srcdoc="{{ text|safe }}"></iframe>
</body>

</html>
